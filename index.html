<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Признание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="scene" data-state="loading">
    <div id="stage"></div>
    <div id="hint" class="pill"><span id="hint-text">Загрузка...</span></div>
    <div id="meter"><div id="meter-fill"></div></div>
    <button id="btn-skip" class="icon-btn" aria-label="Показать сразу">⏭</button>
    <button id="btn-sound" class="icon-btn" aria-label="Звук" aria-pressed="true">🔊</button>
    
    <div id="state-error" class="overlay hidden"><div id="state-error-text"></div></div>
    <div id="state-empty" class="overlay hidden">Здесь пока пусто</div>
    <div id="loader" class="overlay">Загрузка...</div>
    
    <div id="finale" class="overlay hidden">
      <h1>❤️</h1>
      <button id="btn-restart">Сначала</button>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      window.Telegram.WebApp.setHeaderColor('#A9682F');
      window.Telegram.WebApp.setBackgroundColor('#6E431F');
      window.Telegram.WebApp.disableVerticalSwipes();
    }
  </script>
  
  <script src="./core.js"></script>
  <script src="./deck.js"></script>
  <script src="./effects-fog.js"></script>
  <script src="./effects-more.js"></script>
  <script src="./app.js"></script>
  
  <script>
    setTimeout(() => {
      if (!window.__apologyBooted) {
        const err = document.getElementById('state-error');
        const txt = document.getElementById('state-error-text');
        if (err && txt) {
          txt.innerText = 'Ошибка: app.js обрезан или не загружен (нет window.__apologyBooted)';
          err.classList.remove('hidden');
          document.getElementById('scene').dataset.state = 'error';
        }
      }
    }, 6000);
  </script>
</body>
</html>
