<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#A9682F">
<meta name="description" content="Для тебя. Восемь карточек — потри, нажми, погладь.">
<title>Для тебя ❤️</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  /* Ранний инит для будущего Mini App; вне Telegram — безвредно. */
  (function () {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      if (typeof tg.ready === 'function') tg.ready();
      if (typeof tg.expand === 'function') tg.expand();
      if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#A9682F');
      if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#6E431F');
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    } catch (e) { /* noop */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{
  --caramel-900:#3a2210; --caramel-700:#6e431f; --caramel-600:#7e4f27;
  --caramel-500:#a9682f; --caramel-400:#ce9657; --caramel-300:#e0b57f;
  --cream-50:#fffdf8; --cream-100:#fff8ee; --cream-200:#f6e7d2; --cream-300:#ead6bb;
  --ink-900:#241505; --ink-700:#3d2612; --ink-500:#6b4c2e; --ivory:#fff7ec;
  --rust:#b34a2e; --heart:#c0554d;
  --font-display:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --font-text:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-eyebrow:clamp(.6875rem,2.6vw,.75rem);
  --fs-title:clamp(2.1rem,8vw,3.3rem);
  --fs-body:clamp(1.0625rem,4.2vw,1.25rem);
  --fs-ui:clamp(.875rem,3.4vw,.9375rem);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --touch:2.75rem;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-text);color:var(--ink-900);background:var(--caramel-700);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip-link{position:fixed;top:.75rem;left:50%;z-index:90;transform:translate(-50%,-220%);
  padding:.75rem 1.5rem;border-radius:999px;background:var(--caramel-900);color:var(--ivory);
  font-weight:600;text-decoration:none;transition:transform .3s var(--ease)}
.skip-link:focus-visible{transform:translate(-50%,0)}

/* ================= scene ================= */
.scene{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;isolation:isolate}
.scene__paper{position:absolute;inset:0;z-index:1;background-color:var(--cream-100);
  background-image:
    radial-gradient(120% 80% at 14% 6%,var(--cream-50) 0%,rgba(255,253,248,0) 58%),
    radial-gradient(100% 70% at 88% 96%,var(--cream-200) 0%,rgba(246,231,210,0) 62%),
    repeating-linear-gradient(135deg,rgba(107,76,46,.028) 0 1px,rgba(107,76,46,0) 1px 3px)}
.scene__paper::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 100% at 50% 45%,rgba(107,76,46,0) 55%,rgba(107,76,46,.09) 100%)}
.stage{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:calc(1.5rem + env(safe-area-inset-top,0)) 1.25rem
    calc(9.5rem + env(safe-area-inset-bottom,0)) 1.25rem;
  overflow-y:auto;transition:opacity .22s var(--ease)}
.stage.is-out{opacity:0}
.stage.touch-drag{touch-action:none}

/* ================= card ================= */
.card{position:relative;width:100%;max-width:34rem;text-align:center}
.card__eyebrow{margin:0 0 1rem;font-size:var(--fs-eyebrow);font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-500)}
.card__media{display:flex;justify-content:center}
.card__media:empty{display:none}
.card__title{margin:0;font-family:var(--font-display);font-size:var(--fs-title);
  font-weight:600;line-height:1.08;letter-spacing:-.01em;color:var(--ink-900);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.card__body{margin-top:1.25rem;display:grid;gap:1rem;outline:none}
.card__body p{margin:0;font-size:var(--fs-body);line-height:1.7;text-wrap:pretty;
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.card__body p.is-emphasised{color:var(--ink-700);font-weight:500}
.card__actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
.fx-hidden{opacity:0 !important;transform:translateY(.7rem) !important}
.scene[data-state="revealed"] .card__title,
.scene[data-state="revealed"] .card__body p{opacity:1 !important;transform:none !important}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch);
  min-width:var(--touch);padding:.75rem 1.5rem;border:1px solid transparent;border-radius:999px;
  font-size:var(--fs-ui);font-weight:600;cursor:pointer;touch-action:manipulation;
  transition:transform .14s var(--ease),background-color .14s var(--ease),opacity .14s linear}
.btn:focus-visible,.icon-btn:focus-visible,.envelope:focus-visible{outline:3px solid var(--caramel-600);outline-offset:3px}
.btn--primary{background:var(--caramel-900);color:var(--ivory);box-shadow:0 .75rem 2rem -1rem rgba(58,34,16,.35)}
.btn--primary:hover{background:var(--ink-900);transform:translateY(-1px)}
.btn--primary:active{transform:scale(.985)}
.btn--quiet{background:transparent;border-color:rgba(107,76,46,.4);color:var(--ink-700)}
.btn--quiet:hover{background:var(--cream-200)}
.btn--skip{position:static;background:rgba(42,23,8,.78);border-color:rgba(255,247,236,.42);color:var(--ivory)}
.btn--skip:hover{background:var(--caramel-900)}
.icon-btn{min-width:var(--touch);min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;border:1px solid rgba(107,76,46,.4);background:var(--cream-50);
  font-size:1.05rem;cursor:pointer;touch-action:manipulation;transition:background-color .14s var(--ease)}
.icon-btn:hover{background:var(--cream-200)}

/* ================= fixed UI ================= */
.ui-top{position:fixed;top:calc(.75rem + env(safe-area-inset-top,0));right:calc(.75rem + env(safe-area-inset-right,0));z-index:50}
.ui-bottom{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0));
  transform:translateX(-50%);z-index:50;display:grid;justify-items:center;gap:.75rem;
  width:min(20rem,calc(100% - 1.5rem))}
.hint{max-width:100%;padding:.45rem 1rem;border-radius:999px;font-size:var(--fs-ui);font-weight:500;
  line-height:1.4;text-align:center;color:var(--ink-700);background:rgba(255,253,248,.8);
  border:1px solid rgba(107,76,46,.25);transition:opacity .3s var(--ease)}
.scene[data-reveal="fog"] .hint{color:var(--ivory);background:rgba(42,23,8,.4);
  border-color:rgba(255,247,236,.25);text-shadow:0 1px 3px rgba(42,23,8,.6)}
.hint[data-hidden="true"]{opacity:0}
.meter{width:min(14rem,100%);height:.25rem;border-radius:999px;background:rgba(42,23,8,.3);overflow:hidden;
  opacity:0;transition:opacity .3s var(--ease)}
.meter[data-active="true"]{opacity:1}
.meter__fill{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--caramel-300),var(--ivory));transition:width .12s linear}
.loader{position:fixed;inset:0;z-index:55;display:none;place-items:center}
.scene[data-state="loading"] .loader{display:grid}
.loader__dots{display:flex;gap:.5rem}
.loader__dots span{width:.5rem;height:.5rem;border-radius:50%;background:var(--ivory);opacity:.45;
  animation:bounce 1.1s var(--ease) infinite}
.loader__dots span:nth-child(2){animation-delay:.15s}
.loader__dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-.4rem);opacity:1}}

/* ================= panels / finale ================= */
.state-panel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1.5rem;background:var(--cream-100)}
.state-panel__box{width:min(24rem,100%);padding:2rem;border-radius:1.5rem;background:var(--cream-50);
  box-shadow:0 .75rem 2rem -1rem rgba(58,34,16,.35);text-align:center;display:grid;gap:1rem;justify-items:center}
.state-panel__title{margin:0;font-family:var(--font-display);font-size:1.7rem;font-weight:600}
.state-panel__text{margin:0;font-size:var(--fs-ui);line-height:1.6;color:var(--ink-500);overflow-wrap:anywhere}
.finale{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(120% 90% at 50% 30%,var(--cream-50),var(--cream-200))}
.finale[hidden]{display:none}
.finale__box{text-align:center;display:grid;gap:1.25rem;justify-items:center}
.finale__heart{font-size:4.5rem;line-height:1;animation:pulse 1.6s var(--ease) infinite}
.finale__text{margin:0;font-family:var(--font-display);font-size:clamp(1.5rem,6vw,2rem);font-weight:600}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ================= fog ================= */
canvas.fog{position:absolute;inset:0;z-index:30;width:100%;height:100%;touch-action:none;
  cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .55s var(--ease)}
canvas.fog:active{cursor:grabbing}
canvas.fog[data-gone="true"]{opacity:0;pointer-events:none}
.title-ghost{position:fixed;top:0;left:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s var(--ease) .12s}
.title-ghost[data-synced="true"]{opacity:1}
.title-ghost.is-gone{opacity:0;transition-delay:.12s;transition-duration:.2s}
.title-ghost__scrim{position:absolute;inset:-2rem -2.75rem;filter:blur(2px);
  background:radial-gradient(58% 62% at 50% 50%,rgba(58,34,16,.55) 0%,rgba(58,34,16,.34) 46%,rgba(58,34,16,0) 78%)}
.title-ghost__text{position:relative;display:block;color:var(--ivory);text-align:center;
  text-shadow:0 1px 0 rgba(42,23,8,.45),0 0 1.5rem rgba(42,23,8,.35)}

/* ================= cat ================= */
.cat-slot{position:relative;display:flex;width:100%;margin:.5rem auto;touch-action:none;
  user-select:none;-webkit-user-select:none}
.cat-slot--left{justify-content:flex-start}
.cat-slot--right{justify-content:flex-end}
.cat-slot--center{justify-content:center}
.cat-slot--sm .cat-wrap{width:clamp(6rem,22vw,7.5rem)}
.cat-slot--big .cat-wrap{width:clamp(11.5rem,54vw,14.5rem)}
.cat-wrap{position:relative}
.cat{width:100%;height:auto;display:block;cursor:grab}
.cat:active{cursor:grabbing}
.cat__shadow{fill:rgba(107,76,46,.14)}
.cat__tail{fill:none;stroke:#e8a85c;stroke-width:14;stroke-linecap:round;
  transform-box:fill-box;transform-origin:left bottom;animation:tail 2.6s var(--ease) infinite}
.cat__body,.cat__ear,.cat__face{fill:#e8a85c}
.cat__chest,.cat__paw{fill:#f7dfc0}
.cat__ear-inner{fill:#e29a9a}
.cat__stripe{fill:none;stroke:#c97f35;stroke-width:4;stroke-linecap:round}
.cat__eyes-open circle{fill:#3a2210}
.cat__eye-glint{fill:#fff7ec}
.cat__eyes-closed path{fill:none;stroke:#3a2210;stroke-width:4;stroke-linecap:round}
.cat__blush{fill:#e2857f;opacity:0;transition:opacity .32s var(--ease)}
.cat__nose{fill:#d97b7b}
.cat__mouth{fill:none;stroke:#3a2210;stroke-width:3;stroke-linecap:round}
.cat__whiskers path{fill:none;stroke:#3a2210;stroke-width:2.4;stroke-linecap:round;opacity:.45}
.cat__head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .32s var(--ease)}
.cat__zzz{font:600 1.1rem var(--font-text);fill:#6b4c2e;animation:zzz 2.8s var(--ease) infinite}
.cat__zzz--mid{font-size:.9rem;animation-delay:.5s}
.cat__zzz--small{font-size:.75rem;animation-delay:1s}
.cat__purr-bubble rect{fill:#fffdf8;stroke:#ead6bb;stroke-width:2}
.cat__purr-bubble text{font:600 .95rem var(--font-text);fill:#3d2612;text-anchor:middle}
.cat__purr-bubble{opacity:0;transform-box:fill-box;transform-origin:0% 50%;transform:scale(.6);
  transition:opacity .32s var(--ease-out),transform .32s var(--ease-out)}
.cat__eyes-open{display:none}
.is-awake .cat__eyes-open{display:block}
.is-awake .cat__eyes-closed{display:none}
.is-awake .cat__zzz,.is-bliss .cat__zzz,.is-purring .cat__zzz{display:none}
.is-bliss .cat__eyes-open,.is-purring .cat__eyes-open{display:none}
.is-bliss .cat__eyes-closed,.is-purring .cat__eyes-closed{display:block}
.is-bliss .cat__blush,.is-purring .cat__blush{opacity:.55}
.is-bliss .cat__head{transform:rotate(-4deg) translateY(2px)}
.is-purring .cat__head{transform:translateY(2px)}
.is-purring .cat__purr-bubble{opacity:1;transform:scale(1)}
.is-purring .cat__tail{animation-duration:.9s}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes zzz{0%{opacity:0;transform:translateY(4px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:visible}
.heart{position:absolute;left:50%;bottom:55%;width:1.3rem;height:1.3rem;color:var(--heart);
  animation:heart 1.1s var(--ease-out) forwards}
.heart svg{width:100%;height:100%;fill:currentColor}
@keyframes heart{0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),10px) scale(.5)}
  20%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.15)}}

/* ================= envelope ================= */
.fx-envelope{position:absolute;inset:0;z-index:20;display:grid;place-items:center}
.envelope{position:relative;width:min(17rem,80vw);aspect-ratio:1.45;border:0;padding:0;background:none;
  cursor:pointer;perspective:600px;transition:transform .6s var(--ease),opacity .6s var(--ease)}
.envelope__back{position:absolute;inset:0;border-radius:.75rem;background:linear-gradient(160deg,#f3e0c6,#e5c9a3);
  box-shadow:0 1.2rem 2.4rem -1rem rgba(58,34,16,.45)}
.envelope__letter{position:absolute;left:6%;right:6%;top:8%;bottom:0;border-radius:.5rem;background:var(--cream-50);
  box-shadow:0 .3rem .8rem rgba(58,34,16,.18);transition:transform .5s var(--ease) .15s}
.envelope__flap{position:absolute;top:0;left:0;right:0;height:54%;z-index:3;
  background:linear-gradient(#efd8b8,#dfbd90);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transition:transform .5s var(--ease)}
.envelope__seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  width:3rem;height:3rem;border-radius:50%;background:var(--rust);color:var(--ivory);
  display:grid;place-items:center;font-size:1.25rem;box-shadow:0 .3rem .7rem rgba(58,34,16,.35);
  transition:opacity .3s var(--ease)}
.envelope.is-open .envelope__flap{transform:rotateX(180deg)}
.envelope.is-open .envelope__seal{opacity:0}
.envelope.is-open .envelope__letter{transform:translateY(-16%)}
.envelope.is-gone{transform:translateY(45%) scale(.94);opacity:0;pointer-events:none}

/* ================= typewriter ================= */
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;
  vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ================= polaroids ================= */
.polaroid{background:var(--cream-50);padding:.5rem .5rem .85rem;border-radius:.4rem;
  box-shadow:0 .7rem 1.5rem -.6rem rgba(58,34,16,.4);
  opacity:0;transform:rotate(var(--tilt,-3deg)) translateY(1.2rem) scale(.92);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.polaroid.fx-shown{opacity:1;transform:rotate(var(--tilt,-3deg)) translateY(0) scale(1)}
.polaroid:nth-child(odd){--tilt:-3deg}
.polaroid:nth-child(even){--tilt:2.5deg}
.polaroid__photo{aspect-ratio:5/3;border-radius:.3rem;display:grid;place-items:center;font-size:1.9rem}
.polaroid:nth-of-type(1) .polaroid__photo{background:linear-gradient(140deg,#e0b57f,#a9682f)}
.polaroid:nth-of-type(2) .polaroid__photo{background:linear-gradient(140deg,#e8a85c,#b34a2e)}
.polaroid:nth-of-type(3) .polaroid__photo{background:linear-gradient(140deg,#ce9657,#7e4f27)}
.polaroid:nth-of-type(4) .polaroid__photo{background:linear-gradient(140deg,#f3e0c6,#ce9657)}
.polaroid p{margin:.6rem 0 0 !important;font-size:var(--fs-ui) !important;color:var(--ink-700)}

/* ================= steps ================= */
.step{position:relative;padding:.65rem 1rem;background:var(--cream-50);border:1px solid var(--cream-300);
  border-radius:.8rem;box-shadow:0 .4rem 1rem -.5rem rgba(58,34,16,.3);text-align:left;
  opacity:0;transform:translateY(.9rem);transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
.step.fx-shown{opacity:1;transform:none}
.step:nth-of-type(2){margin-left:1.1rem}
.step:nth-of-type(3){margin-left:2.2rem}
.step::before{content:"🐾";position:absolute;left:-1.35rem;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.7}
.step p{margin:0 !important;font-size:var(--fs-ui) !important}

/* ================= scroll ================= */
.fx-scroll{clip-path:inset(0 0 calc(100% - var(--unroll,10%)) 0)}
.fx-scroll.fx-open{clip-path:none}
.fx-scroll-roll{position:absolute;left:-2%;right:-2%;height:1.3rem;border-radius:999px;z-index:6;
  background:linear-gradient(180deg,#f3e0c6,#c9a06b);box-shadow:0 .45rem .9rem rgba(58,34,16,.35);
  transform:translateY(-55%);transition:opacity .4s var(--ease)}
.fx-scroll-roll[data-done="true"]{opacity:0}

/* ================= compass ================= */
.compass{width:clamp(8.5rem,32vw,10.5rem);height:auto;margin-bottom:1rem;cursor:pointer}
.compass__ring{fill:none;stroke:#9a6331;stroke-width:3}
.compass__dial{fill:var(--cream-50);stroke:var(--cream-300);stroke-width:2}
.compass__tick{stroke:#6b4c2e;stroke-width:2;opacity:.5}
.compass__tick--major{stroke-width:3;opacity:.85}
.compass__letter{font:600 13px var(--font-text);fill:#6b4c2e;text-anchor:middle}
.compass__heart{fill:var(--heart)}
.compass__needle{transform-box:fill-box;transform-origin:50% 50%;animation:lost 3.4s ease-in-out infinite}
.compass.is-settled .compass__needle{animation:settle 1.9s var(--ease-out) forwards}
.compass__needle-n{fill:var(--rust)}
.compass__needle-s{fill:var(--caramel-400)}
.compass__pin{fill:var(--caramel-900)}
@keyframes lost{0%{transform:rotate(-26deg)}25%{transform:rotate(18deg)}50%{transform:rotate(-12deg)}75%{transform:rotate(7deg)}100%{transform:rotate(-26deg)}}
@keyframes settle{0%{transform:rotate(-55deg)}40%{transform:rotate(12deg)}70%{transform:rotate(-5deg)}100%{transform:rotate(0deg)}}

/* ================= a11y ================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}
@media (max-height:34rem){
  .stage{align-items:flex-start;padding-top:2.5rem}
}
</style>
</head>
<body>
<a class="skip-link" href="#card-body">К тексту</a>

<main class="scene" id="scene" data-state="loading" data-reveal="">
  <div class="scene__paper" aria-hidden="true"></div>
  <div class="stage" id="stage"></div>

  <div class="ui-top">
    <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" aria-label="Звук мурчания: включён">🔊</button>
  </div>

  <div class="ui-bottom">
    <p class="hint" id="hint" data-hidden="false"><span id="hint-text"></span></p>
    <div class="meter" id="meter" data-active="false" aria-hidden="true"><span class="meter__fill" id="meter-fill"></span></div>
    <button class="btn btn--skip" id="btn-skip" type="button">Показать сразу</button>
  </div>

  <section class="state-panel" id="state-error" hidden>
    <div class="state-panel__box">
      <h2 class="state-panel__title">Что-то пошло не так</h2>
      <p class="state-panel__text" id="state-error-text">Обнови страницу — текст никуда не делся.</p>
      <button class="btn btn--primary" id="btn-reload" type="button">Обновить</button>
    </div>
  </section>

  <section class="state-panel" id="state-empty" hidden>
    <div class="state-panel__box">
      <h2 class="state-panel__title">Здесь пока пусто</h2>
      <p class="state-panel__text">В этой карточке нет текста.</p>

function createPurrAudio(logger) {

        const d = buf.getChannelData(0);

        for (let i = 0; i < len; i += 1) {
          const w = Math.random() * 2 - 1;
          last = (last + 0.02 * w) / 1.02;
          d[i] = last * 3.5;

        const src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 170; lp.Q.value = 0.9;
        const lfo = ctx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = 24;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value = volume * 0.85;
        gain = ctx.createGain();
        gain.gain.value = 0.0001;
        src.connect(lp); lp.connect(gain);
        lfo.connect(lfoGain); lfoGain.connect(gain.gain);
        gain.connect(ctx.destination);
        src.start(); lfo.start();
      }
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});

    } catch (e) { failed = true; logger.warn('purr audio failed', e); return null; }

    if (!ctx || !gain) return;
    const t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(Math.max(gain.gain.value, 0.0001), t);
    gain.gain.linearRampToValueAtTime(Math.max(target, 0.0001), t + sec);
  }

    get muted() { return muted; },
    setMuted(v) { muted = Boolean(v); if (muted) { sustained = false; ramp(0, 0.15); } },
    start() { if (muted) return; if (!graph()) return; sustained = true; ramp(volume, 0.3); },
    burst() {

        this.host.impact('soft');
        if (this._hapticCount >= 8) clearInterval(this._hapticTimer);
      }, 300);
    }
    for (let i = 0; i < 8; i += 1) setTimeout(() => this._heart(), i * 90);
    if (this.onComplete) this.onComplete({ pets: this.pets });
  }
  revealNow() {
    if (!this.gated || this.completed) return;
    this.pets = this.petsNeeded;
    if (!this._touched) { this._touched = true; this.el.classList.add('is-awake'); }
    this._complete();
  }
  reset() {
    clearTimeout(this._blissTimer);
    clearTimeout(this._purrTimer);
    clearInterval(this._hapticTimer);
    this.pets = 0;
    this.completed = false;
    this._touched = false;
    this.el.classList.remove('is-awake', 'is-bliss', 'is-purring');
    if (this.hearts) this.hearts.replaceChildren();
    if (this.audio) this.audio.stop();
  }
  destroy() {
    if (this.destroyed) return;
    this.destroyed = true;
    clearTimeout(this._blissTimer);
    clearTimeout(this._purrTimer);
    clearInterval(this._hapticTimer);
    this.el.removeEventListener('pointerdown', this._down);
    this.el.removeEventListener('pointermove', this._move);
    this.el.removeEventListener('pointerup', this._up);
    this.el.removeEventListener('pointercancel', this._up);
    if (this.audio) this.audio.stop();
    this.el.replaceChildren();
  }
}

/* ================= EFFECTS ================= */
/* Контракт: mount(), reset(), revealNow(), destroy();
   колбэки через ctx: onProgress(r), onComplete(stats), onFirstTouch(). */

/* ---- 1. fog wipe ---- */
class FogEffect {
  constructor(ctx, opts) {
    this.ctx = ctx;
    this.threshold = clamp(opts.threshold || 0.42, 0.05, 0.95);
    this.brushRatio = clamp(opts.brushRatio || 0.11, 0.03, 0.3);
    this.seed = 20260915;
    this.progress = 0;
    this.completed = false;
    this.destroyed = false;
    this._pointers = new Map();
    this._queue = [];
    this._frame = 0;
    this._lastSample = 0;
    this._resizeTimer = 0;
    this._dpr = 1;
    this._down = this._down.bind(this);
    this._move = this._move.bind(this);
    this._up = this._up.bind(this);
    this._resizeNow = () => {
      clearTimeout(this._resizeTimer);
      this._resizeTimer = setTimeout(() => this._resize(), 150);
    };
    this._flush = this._flush.bind(this);
  }
  mount() {
    const scene = this.ctx.scene;
    this.canvas = document.createElement('canvas');
    this.canvas.className = 'fog';
    this.canvas.setAttribute('aria-hidden', 'true');
    scene.appendChild(this.canvas);
    this.main = this.canvas.getContext('2d');
    this.fogLayer = document.createElement('canvas');
    this.fogCtx = this.fogLayer.getContext('2d');
    this.mask = document.createElement('canvas');
    this.maskCtx = this.mask.getContext('2d');
    this.sampler = document.createElement('canvas');
    this.samplerCtx = this.sampler.getContext('2d', { willReadFrequently: true });
    if (!this.main || !this.fogCtx || !this.maskCtx || !this.samplerCtx) {
      throw new Error('Canvas 2D недоступен');
    }
    this._makeGhost();
    this._resize();
    this.ctx.title.classList.add('fx-hidden');
    this.canvas.addEventListener('pointerdown', this._down);
    this.canvas.addEventListener('pointermove', this._move);
    this.canvas.addEventListener('pointerup', this._up);
    this.canvas.addEventListener('pointercancel', this._up);
    window.addEventListener('resize', this._resizeNow);
    if (typeof ResizeObserver === 'function') {
      this._ro = new ResizeObserver(() => this._syncGhost());
      this._ro.observe(this.ctx.title);
    }
    return this;
  }
  _makeGhost() {
    this.ghost = document.createElement('div');
    this.ghost.className = 'title-ghost';
    this.ghost.setAttribute('aria-hidden', 'true');
    this.ghost.innerHTML = '<span class="title-ghost__scrim"></span>' +
      '<span class="title-ghost__text card__title"></span>';
    this.ghost.querySelector('.title-ghost__text').textContent = this.ctx.title.textContent;
    this.ctx.scene.appendChild(this.ghost);
    this._syncGhost();
  }
  _syncGhost() {
    if (!this.ghost) return;
    const r = this.ctx.title.getBoundingClientRect();
    if (r.width < 1) { this.ghost.removeAttribute('data-synced'); return; }
    this.ghost.style.left = Math.round(r.left) + 'px';
    this.ghost.style.top = Math.round(r.top) + 'px';
    this.ghost.style.width = Math.round(r.width) + 'px';
    if (!this.completed) this.ghost.setAttribute('data-synced', 'true');
  }
  _brushRadius() {
    return Math.max(14, Math.min(this._w, this._h) * this.brushRatio);
  }
  _makeBrush() {
    const r = Math.ceil(this._brushRadius());
    const size = r * 2;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const bctx = c.getContext('2d');
    const g = bctx.createRadialGradient(r, r, r * 0.04, r, r, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.55, 'rgba(0,0,0,.9)');
    g.addColorStop(0.86, 'rgba(0,0,0,.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    bctx.fillStyle = g;
    bctx.fillRect(0, 0, size, size);
    const rnd = mulberry32(7);
    bctx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 7; i += 1) {
      const a = rnd() * Math.PI * 2;
      const d = r * (0.62 + rnd() * 0.34);
      const br = r * (0.1 + rnd() * 0.16);
      const x = r + Math.cos(a) * d, y = r + Math.sin(a) * d;
      const bg = bctx.createRadialGradient(x, y, 0, x, y, br);
      bg.addColorStop(0, 'rgba(0,0,0,' + (0.25 + rnd() * 0.3) + ')');
      bg.addColorStop(1, 'rgba(0,0,0,0)');
      bctx.fillStyle = bg;
      bctx.beginPath(); bctx.arc(x, y, br, 0, Math.PI * 2); bctx.fill();
    }
    this.brush = { canvas: c, radius: r };
  }
  _paint() {
    const c = this.fogCtx, w = this._w, h = this._h;
    const rnd = mulberry32(this.seed);
    c.clearRect(0, 0, w, h);
    const base = c.createLinearGradient(w, 0, 0, h);
    base.addColorStop(0, '#CE9657');
    base.addColorStop(0.42, '#A9682F');
    base.addColorStop(1, '#6E431F');
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const bloom = c.createRadialGradient(w * 0.78, h * 0.1, 0, w * 0.78, h * 0.1, Math.hypot(w, h) * 0.8);
    bloom.addColorStop(0, 'rgba(255,222,175,.38)');
    bloom.addColorStop(0.4, 'rgba(232,178,112,.12)');
    bloom.addColorStop(1, 'rgba(232,178,112,0)');
    c.fillStyle = bloom; c.fillRect(0, 0, w, h);
    const sh = c.createRadialGradient(w * 0.12, h * 0.92, 0, w * 0.12, h * 0.92, Math.hypot(w, h) * 0.7);
    sh.addColorStop(0, 'rgba(66,36,12,.34)');
    sh.addColorStop(1, 'rgba(66,36,12,0)');
    c.fillStyle = sh; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 14; i += 1) {
      const x = rnd() * w, y = rnd() * h, rr = Math.hypot(w, h) * (0.06 + rnd() * 0.16);
      const warm = rnd() > 0.45, al = 0.03 + rnd() * 0.07;
      const bl = c.createRadialGradient(x, y, 0, x, y, rr);
      bl.addColorStop(0, warm ? 'rgba(255,226,184,' + al + ')' : 'rgba(74,42,16,' + al + ')');
      bl.addColorStop(1, warm ? 'rgba(255,226,184,0)' : 'rgba(74,42,16,0)');
      c.fillStyle = bl; c.beginPath(); c.arc(x, y, rr, 0, Math.PI * 2); c.fill();
    }
    for (let i = 0; i < 70; i += 1) {
      const x = rnd() * w, y = rnd() * h, dr = 1 + Math.pow(rnd(), 2.4) * Math.min(w, h) * 0.022;
      const dg = c.createRadialGradient(x - dr * 0.32, y - dr * 0.36, dr * 0.08, x, y, dr);
      dg.addColorStop(0, 'rgba(255,241,216,.5)');
      dg.addColorStop(0.5, 'rgba(255,224,182,.12)');
      dg.addColorStop(0.85, 'rgba(84,48,18,.2)');
      dg.addColorStop(1, 'rgba(84,48,18,0)');
      c.fillStyle = dg; c.beginPath(); c.arc(x, y, dr, 0, Math.PI * 2); c.fill();
    }
    const vg = c.createRadialGradient(w / 2, h * 0.45, Math.min(w, h) * 0.28, w / 2, h * 0.5, Math.hypot(w, h) * 0.72);
    vg.addColorStop(0, 'rgba(42,23,8,0)');
    vg.addColorStop(1, 'rgba(42,23,8,.42)');
    c.fillStyle = vg; c.fillRect(0, 0, w, h);
  }
  _resize() {
    if (this.destroyed) return;
    const r = this.ctx.scene.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width));
    const h = Math.max(1, Math.round(r.height));
    const dpr = clamp(window.devicePixelRatio || 1, 1, 2);
    const snap = this.mask && this.mask.width > 0 ? (() => {
      const s = document.createElement('canvas');
      s.width = this.mask.width; s.height = this.mask.height;
      s.getContext('2d').drawImage(this.mask, 0, 0);
      return s;
    })() : null;
    this._w = w; this._h = h; this._dpr = dpr;
    for (const s of [this.canvas, this.fogLayer, this.mask]) {
      s.width = Math.round(w * dpr); s.height = Math.round(h * dpr);
    }
    this.main.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.fogCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.maskCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sh = Math.max(1, Math.round(56 * h / w));
    this.sampler.width = 56; this.sampler.height = sh;
    this._makeBrush();
    this._paint();
    if (snap) this.maskCtx.drawImage(snap, 0, 0, w, h);
    this._composite();
    this._syncGhost();
  }
  _composite() {
    this.main.save();
    this.main.setTransform(1, 0, 0, 1, 0, 0);
    this.main.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.main.drawImage(this.fogLayer, 0, 0);
    this.main.globalCompositeOperation = 'destination-out';
    this.main.drawImage(this.mask, 0, 0);
    this.main.restore();
  }
  _local(e) {
    const r = this.canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  _down(e) {
    if (this.completed || this.destroyed) return;
    e.preventDefault();
    try { this.canvas.setPointerCapture(e.pointerId); } catch { /* noop */ }
    const p = this._local(e);
    this._pointers.set(e.pointerId, p);
    this._queue.push(p);
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    this._schedule();
  }
  _move(e) {
    if (this.completed || this.destroyed) return;
    const prev = this._pointers.get(e.pointerId);
    if (!prev) return;
    e.preventDefault();
    const p = this._local(e);
    this._queue.push(...buildStrokePoints(prev, p, this._brushRadius() * 0.28));
    this._pointers.set(e.pointerId, p);
    this._schedule();
  }
  _up(e) { this._pointers.delete(e.pointerId); }
  _schedule() {
    if (this._frame || this.destroyed) return;
    this._frame = requestAnimationFrame(this._flush);
  }
  _flush() {
    this._frame = 0;
    if (this.destroyed || this.completed) return;
    if (this._queue.length) {
      const stamp = this.brush.canvas;
      const radius = this.brush.radius;
      this.maskCtx.globalCompositeOperation = 'destination-out';
      this.main.globalCompositeOperation = 'destination-out';
      for (const p of this._queue) {
        this.maskCtx.drawImage(stamp, p.x - radius, p.y - radius);
        this.main.drawImage(stamp, p.x - radius, p.y - radius);
      }
      this.maskCtx.globalCompositeOperation = 'source-over';
      this.main.globalCompositeOperation = 'source-over';
      this._queue.length = 0;
    }
    const now = performance.now();
    if (now - this._lastSample >= 160) {
      this._lastSample = now;
      this._sample();
    } else {
      this._schedule();
    }
  }
  _sample() {
    try {
      this.samplerCtx.clearRect(0, 0, this.sampler.width, this.sampler.height);
      this.samplerCtx.drawImage(this.canvas, 0, 0, this.sampler.width, this.sampler.height);
      const img = this.samplerCtx.getImageData(0, 0, this.sampler.width, this.sampler.height);
      this.progress = computeClearedRatio(img.data);
      if (this.ctx.onProgress) this.ctx.onProgress(clamp(this.progress / this.threshold, 0, 1));
      if (this.progress >= this.threshold) this._complete();
    } catch (e) { this.ctx.logger.warn('fog sampling failed', e); }
  }
  _complete() {
    if (this.completed) return;
    this.completed = true;
    this.canvas.dataset.gone = 'true';
    this.ghost.classList.add('is-gone');
    this.ctx.title.classList.remove('fx-hidden');
    this.ctx.logger.info('fog cleared');
    if (this.ctx.onComplete) this.ctx.onComplete({});
  }
  revealNow() {
    if (this.completed) return;
    this.maskCtx.save();
    this.maskCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.maskCtx.fillStyle = 'rgba(0,0,0,1)');
    this.maskCtx.fillRect(0, 0, this.mask.width, this.mask.height);
    this.maskCtx.restore();
    this._composite();
    this._complete();
  }
  reset() {
    this.completed = false;
    this.progress = 0;
    this._pointers.clear();
    this._queue.length = 0;
    this.maskCtx.save();
    this.maskCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.maskCtx.clearRect(0, 0, this.mask.width, this.mask.height);
    this.maskCtx.restore();
    this._composite();
    this.canvas.dataset.gone = 'false';
    this.ghost.classList.remove('is-gone');
    this.ghost.setAttribute('data-synced', 'true');
    this.ctx.title.classList.add('fx-hidden');
    if (this.ctx.onProgress) this.ctx.onProgress(0);
  }
  destroy() {
    this.destroyed = true;
    if (this._frame) cancelAnimationFrame(this._frame);
    clearTimeout(this._resizeTimer);
    if (this._ro) this._ro.disconnect();
    window.removeEventListener('resize', this._resizeNow);
    this.canvas.removeEventListener('pointerdown', this._down);
    this.canvas.removeEventListener('pointermove', this._move);
    this.canvas.removeEventListener('pointerup', this._up);
    this.canvas.removeEventListener('pointercancel', this._up);
    this.canvas.remove();
    this.ghost.remove();
  }
}

/* ---- 2. envelope ---- */
class EnvelopeEffect {
  constructor(ctx) { this.ctx = ctx; this.opened = false; this._timers = []; }
  mount() {
    this.opened = false;
    const { title, paragraphs, catSlot } = this.ctx;
    this._hidden = [title, ...paragraphs];
    if (catSlot) this._hidden.push(catSlot);
    this._hidden.forEach((el) => el.classList.add('fx-hidden'));
    this.root = document.createElement('div');
    this.root.className = 'fx-envelope';
    this.root.innerHTML =
      '<button class="envelope" type="button" aria-label="Открыть конверт">' +
      '<span class="envelope__back"></span>' +
      '<span class="envelope__letter"></span>' +
      '<span class="envelope__flap"></span>' +
      '<span class="envelope__seal" aria-hidden="true">♥</span>' +
      '</button>';
    this.btn = this.root.querySelector('.envelope');
    this.btn.addEventListener('click', () => this._open());
    this.ctx.stage.appendChild(this.root);
    return this;
  }
  _open() {
    if (this.opened) return;
    this.opened = true;
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    this.ctx.host.impact('medium');
    const d = this.ctx.reducedMotion ? 0 : 1;
    this.btn.classList.add('is-open');
    this._timers.push(setTimeout(() => {
      this.btn.classList.add('is-gone');
      this._hidden.forEach((el, i) => {
        el.style.transitionDelay = (i * 120 * d) + 'ms';
        el.classList.remove('fx-hidden');
      });
      if (this.ctx.onProgress) this.ctx.onProgress(1);
      this._timers.push(setTimeout(() => {
        if (this.ctx.onComplete) this.ctx.onComplete({});
      }, (650 + this._hidden.length * 120) * d));
    }, 420 * d));
  }
  revealNow() { this._open(); }
  reset() {
    this._timers.forEach(clearTimeout);
    this._timers = [];
    this.destroy();
    this.mount();
  }
  destroy() {
    this._timers.forEach(clearTimeout);
    this._timers = [];
    if (this.root) this.root.remove();
  }
}

/* ---- 3. typewriter ---- */
class TypewriterEffect {
  constructor(ctx) {
    this.ctx = ctx;
    this._timer = 0;
    this._skipLine = false;
    this.destroyed = false;
    this._tap = this._tap.bind(this);
  }
  mount() {
    this.texts = this.ctx.paragraphs.map((p) => p.textContent);
    this.total = this.texts.reduce((s, t) => s + t.length, 0);
    this.typedTotal = 0;
    this.line = 0;
    this.pos = 0;
    this.wait = 0;
    this.done = false;
    this.ctx.paragraphs.forEach((p) => { p.textContent = ''; });
    this.caret = document.createElement('span');
    this.caret.className = 'caret';
    this.caret.setAttribute('aria-hidden', 'true');
    this.ctx.paragraphs[0].appendChild(this.caret);
    this.ctx.card.addEventListener('pointerdown', this._tap);
    this._timer = setInterval(() => this._tick(), 24);
    return this;
  }
  _tap() { this._skipLine = true; }
  _tick() {
    if (this.destroyed || this.done) return;
    if (this.wait > 0) { this.wait -= 1; return; }
    const text = this.texts[this.line];
    const p = this.ctx.paragraphs[this.line];
    if (this._skipLine) {
      this._skipLine = false;
      this.typedTotal += text.length - this.pos;
      this.pos = text.length;
    } else if (this.pos < text.length) {
      this.pos += 1;
      this.typedTotal += 1;
      const ch = text[this.pos - 1];
      if ('.!?…'.includes(ch)) this.wait = 7;
    }
    p.textContent = text.slice(0, this.pos);
    p.appendChild(this.caret);
    if (this.ctx.onProgress) this.ctx.onProgress(clamp(this.typedTotal / this.total, 0, 1));
    if (this.pos >= text.length) {
      this.line += 1;
      this.pos = 0;
      this.wait = 10;
      if (this.line >= this.texts.length) this._finish();
      else this.ctx.paragraphs[this.line].appendChild(this.caret);
    }
  }
  _finish() {
    if (this.done) return;
    this.done = true;
    clearInterval(this._timer);
    this.caret.remove();
    this.ctx.paragraphs.forEach((p, i) => { p.textContent = this.texts[i]; });
    if (this.ctx.onProgress) this.ctx.onProgress(1);
    if (this.ctx.onComplete) this.ctx.onComplete({});
  }
  revealNow() { this._finish(); }
  reset() {
    clearInterval(this._timer);
    this.destroy();
    this.mount();
  }
  destroy() {
    this.destroyed = true;
    clearInterval(this._timer);
    this.ctx.card.removeEventListener('pointerdown', this._tap);
    if (this.caret) this.caret.remove();
  }
}

/* ---- 4. polaroids ---- */
class PolaroidEffect {
  constructor(ctx) {
    this.ctx = ctx;
    this.shown = 0;
    this.done = false;
    this._timer = 0;
    this._tap = this._tap.bind(this);
  }
  mount() {
    this.shown = 0;
    this.done = false;
    const glyphs = ['🌤', '💗', '🫂', '😊'];
    const ps = this.ctx.paragraphs;
    this.polIndexes = [1, 2, 3, 4];
    this.closing = ps[5];
    this.closing.classList.add('fx-hidden');
    this.pols = this.polIndexes.map((idx, i) => {
      const p = ps[idx];
      const pol = document.createElement('div');
      pol.className = 'polaroid';
      p.parentNode.insertBefore(pol, p);
      const photo = document.createElement('div');
      photo.className = 'polaroid__photo';
      photo.setAttribute('aria-hidden', 'true');
      photo.textContent = glyphs[i];
      pol.appendChild(photo);
      pol.appendChild(p);
      return pol;
    });
    this.total = this.pols.length + 1;
    this.ctx.card.addEventListener('pointerdown', this._tap);
    this._timer = setTimeout(() => this._next(), 600);
    return this;
  }
  _tap() { this._next(); }
  _next() {
    if (this.done) return;
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    if (this.shown < this.pols.length) {
      this.pols[this.shown].classList.add('fx-shown');
      this.shown += 1;
      this.ctx.host.impact('light');
      if (this.ctx.onProgress) this.ctx.onProgress(this.shown / this.total);
    } else {
      this.done = true;
      this.closing.classList.remove('fx-hidden');
      if (this.ctx.onProgress) this.ctx.onProgress(1);
      setTimeout(() => { if (this.ctx.onComplete) this.ctx.onComplete({}); },
        this.ctx.reducedMotion ? 0 : 500);
    }
  }
  revealNow() {
    clearTimeout(this._timer);
    while (!this.done) this._next();
  }
  reset() {
    clearTimeout(this._timer);
    this.ctx.card.removeEventListener('pointerdown', this._tap);
    this.pols.forEach((pol) => {
      const p = pol.querySelector('p');
      pol.parentNode.insertBefore(p, pol);
      pol.remove();
    });
    this.closing.classList.add('fx-hidden');
    this.shown = 0;
    this.done = false;
    this.ctx.card.addEventListener('pointerdown', this._tap);
    this._timer = setTimeout(() => this._next(), 600);
    if (this.ctx.onProgress) this.ctx.onProgress(0);
  }
  destroy() {
    clearTimeout(this._timer);
    this.ctx.card.removeEventListener('pointerdown', this._tap);
  }
}

/* ---- 5. steps ---- */
class StepsEffect {
  constructor(ctx) {
    this.ctx = ctx;
    this.shown = 0;
    this.done = false;
    this._tap = this._tap.bind(this);
  }
  mount() {
    this.shown = 0;
    this.done = false;
    const ps = this.ctx.paragraphs;
    this.steps = [2, 3, 4].map((idx) => {
      const p = ps[idx];
      const step = document.createElement('div');
      step.className = 'step';
      p.parentNode.insertBefore(step, p);
      step.appendChild(p);
      return step;
    });
    this.ctx.card.addEventListener('pointerdown', this._tap);
    return this;
  }
  _tap() {
    if (this.done) return;
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    if (this.shown < this.steps.length) {
      this.steps[this.shown].classList.add('fx-shown');
      this.shown += 1;
      this.ctx.host.impact('light');
      if (this.ctx.onProgress) this.ctx.onProgress(this.shown / this.steps.length);
      if (this.shown === this.steps.length) {
        this.done = true;
        setTimeout(() => { if (this.ctx.onComplete) this.ctx.onComplete({}); },
          this.ctx.reducedMotion ? 0 : 480);
      }
    }
  }
  revealNow() {
    this.steps.forEach((s) => s.classList.add('fx-shown'));
    this.shown = this.steps.length;
    this.done = true;
    if (this.ctx.onProgress) this.ctx.onProgress(1);
    if (this.ctx.onComplete) this.ctx.onComplete({});
  }
  reset() {
    this.steps.forEach((s) => s.classList.remove('fx-shown'));
    this.shown = 0;
    this.done = false;
    if (this.ctx.onProgress) this.ctx.onProgress(0);
  }
  destroy() {
    this.ctx.card.removeEventListener('pointerdown', this._tap);
    if (this.steps) this.steps.forEach((step) => {
      const p = step.querySelector('p');
      if (p) step.parentNode.insertBefore(p, step);
      step.remove();
    });
  }
}

/* ---- 6. scroll ---- */
class ScrollEffect {
  constructor(ctx) {
    this.ctx = ctx;
    this.progress = 0.1;
    this.done = false;
    this._lastY = null;
    this._moved = 0;
    this._down = this._down.bind(this);
    this._move = this._move.bind(this);
    this._up = this._up.bind(this);
  }
  mount() {
    this.progress = 0.1;
    this.done = false;
    this.body = this.ctx.body;
    this.body.classList.add('fx-scroll');
    this.roll = document.createElement('div');
    this.roll.className = 'fx-scroll-roll';
    this.roll.setAttribute('aria-hidden', 'true');
    this.ctx.card.appendChild(this.roll);
    this.ctx.stage.classList.add('touch-drag');
    this.ctx.stage.addEventListener('pointerdown', this._down);
    this.ctx.stage.addEventListener('pointermove', this._move);
    this.ctx.stage.addEventListener('pointerup', this._up);
    this.ctx.stage.addEventListener('pointercancel', this._up);
    this._apply();
    return this;
  }
  _apply() {
    this.body.style.setProperty('--unroll', (this.progress * 100) + '%');
    const top = this.body.offsetTop + this.body.offsetHeight * this.progress;
    this.roll.style.top = top + 'px';
    if (this.ctx.onProgress) this.ctx.onProgress(clamp((this.progress - 0.1) / 0.9, 0, 1));
  }
  _down(e) {
    if (this.done) return;
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    this._lastY = e.clientY;
    this._moved = 0;
    try { this.ctx.stage.setPointerCapture(e.pointerId); } catch { /* noop */ }
  }
  _move(e) {
    if (this.done || this._lastY == null) return;
    e.preventDefault();
    const dy = e.clientY - this._lastY;
    this._lastY = e.clientY;
    this._moved += Math.abs(dy);
    const needed = Math.max(120, this.body.offsetHeight * 0.9);
    this.progress = clamp(this.progress + dy / needed, 0.1, 1);
    this._apply();
    if (this.progress >= 0.97) this._finish();
  }
  _up() {
    if (this._moved < 8 && !this.done) {
      this.progress = clamp(this.progress + 0.07, 0.1, 1);
      this._apply();
      if (this.progress >= 0.97) this._finish();
    }
    this._lastY = null;
  }
  _finish() {
    if (this.done) return;
    this.done = true;
    this.progress = 1;
    this.body.classList.add('fx-open');
    this.roll.dataset.done = 'true';
    if (this.ctx.onProgress) this.ctx.onProgress(1);
    if (this.ctx.onComplete) this.ctx.onComplete({});
  }
  revealNow() { this._finish(); this._apply(); }
  reset() {
    this.done = false;
    this.progress = 0.1;
    this.body.classList.remove('fx-open');
    this.roll.dataset.done = 'false';
    this._apply();
  }
  destroy() {
    this.ctx.stage.classList.remove('touch-drag');
    this.ctx.stage.removeEventListener('pointerdown', this._down);
    this.ctx.stage.removeEventListener('pointermove', this._move);
    this.ctx.stage.removeEventListener('pointerup', this._up);
    this.ctx.stage.removeEventListener('pointercancel', this._up);
    this.body.classList.remove('fx-scroll');
    this.body.style.removeProperty('--unroll');
    this.roll.remove();
  }
}

/* ---- 7. cat gate ---- */
class CatEffect {
  constructor(ctx, opts) { this.ctx = ctx; this.opts = opts; }
  mount() {
    const { title, paragraphs } = this.ctx;
    this._hidden = [title, ...paragraphs];
    this._hidden.forEach((el) => el.classList.add('fx-hidden'));
    this.slot = document.createElement('div');
    this.slot.className = 'cat-slot cat-slot--center cat-slot--big';
    title.insertAdjacentElement('afterend', this.slot);
    this.cat = new CatCompanion(this.slot, {
      gated: true,
      small: false,
      petsNeeded: this.opts.petsNeeded || 6,
      reducedMotion: this.ctx.reducedMotion,
      host: this.ctx.host,
      audio: this.ctx.audio,
      onFirstTouch: () => { if (this.ctx.onFirstTouch) this.ctx.onFirstTouch(); },
      onProgress: (r) => { if (this.ctx.onProgress) this.ctx.onProgress(r); },
      onComplete: () => this._reveal()
    }).mount();
    return this;
  }
  _reveal() {
    this._hidden.forEach((el, i) => {
      el.style.transitionDelay = (i * 140) + 'ms';
      el.classList.remove('fx-hidden');
    });
    setTimeout(() => { if (this.ctx.onComplete) this.ctx.onComplete({}); },
      (500 + this._hidden.length * 140) * (this.ctx.reducedMotion ? 0 : 1));
  }
  revealNow() { this.cat.revealNow(); }
  reset() {
    this.cat.reset();
    this._hidden.forEach((el) => {
      el.style.transitionDelay = '';
      el.classList.add('fx-hidden');
    });
    if (this.ctx.onProgress) this.ctx.onProgress(0);
  }
  destroy() {
    if (this.cat) this.cat.destroy();
    if (this.slot) this.slot.remove();
  }
}

/* ---- 8. compass ---- */
function buildCompassSvg(label) {
  const ticks = [];
  for (let i = 0; i < 32; i += 1) {
    const a = ((i * 360) / 32) * (Math.PI / 180);
    const major = i % 8 === 0;
    const r1 = major ? 60 : 67, r2 = 76;
    const cls = major ? 'compass__tick compass__tick--major' : 'compass__tick';
    ticks.push('<line class="' + cls + '" x1="' + (100 + Math.cos(a) * r1).toFixed(2) +
      '" y1="' + (100 + Math.sin(a) * r1).toFixed(2) +
      '" x2="' + (100 + Math.cos(a) * r2).toFixed(2) +
      '" y2="' + (100 + Math.sin(a) * r2).toFixed(2) + '"/>');
  }
  return '<svg class="compass" viewBox="0 0 200 200" role="img" aria-label="' + label + '">' +
    '<circle class="compass__ring" cx="100" cy="100" r="88"/>' +
    '<circle class="compass__dial" cx="100" cy="100" r="80"/>' +
    ticks.join('') +
    '<text class="compass__letter" x="172" y="105">В</text>' +
    '<text class="compass__letter" x="100" y="178">Ю</text>' +
    '<text class="compass__letter" x="28" y="105">З</text>' +
    '<path class="compass__heart" d="M100 46 l-1.8-1.6 C91.4 38.4 87 34.4 87 29.6 87 25.6 90.1 22.5 94.1 22.5 c2.3 0 4.5 1.1 5.9 2.8 1.4-1.7 3.6-2.8 5.9-2.8 4 0 7.1 3.1 7.1 7.1 0 4.8-4.4 8.8-11.2 14.8 z"/>' +
    '<g class="compass__needle"><path class="compass__needle-n" d="M100 40 L107 100 L93 100 Z"/>' +
    '<path class="compass__needle-s" d="M100 160 L107 100 L93 100 Z"/></g>' +
    '<circle class="compass__pin" cx="100" cy="100" r="6"/></svg>';
}
class CompassEffect {
  constructor(ctx) {
    this.ctx = ctx;
    this._timer = 0;
    this.done = false;
    this._tap = this._tap.bind(this);
  }
  mount() {
    this.done = false;
    const media = this.ctx.media;
    media.innerHTML = buildCompassSvg('Компас, стрелка которого указывает на сердце');
    this.compass = media.querySelector('.compass');
    this.compass.addEventListener('click', this._tap);
    this._hidden = [this.ctx.title, ...this.ctx.paragraphs];
    this._hidden.forEach((el) => el.classList.add('fx-hidden'));
    this._timer = setTimeout(() => this._settle(), 3400);
    return this;
  }
  _tap() { this._settle(); }
  _settle() {
    if (this.done) return;
    this.done = true;
    clearTimeout(this._timer);
    if (this.ctx.onFirstTouch) this.ctx.onFirstTouch();
    this.ctx.host.impact('medium');
    this.compass.classList.add('is-settled');
    const d = this.ctx.reducedMotion ? 0 : 1;
    setTimeout(() => {
      this._hidden.forEach((el, i) => {
        el.style.transitionDelay = (i * 150 * d) + 'ms';
        el.classList.remove('fx-hidden');
      });
      if (this.ctx.onProgress) this.ctx.onProgress(1);
      setTimeout(() => { if (this.ctx.onComplete) this.ctx.onComplete({}); },
        (600 + this._hidden.length * 150) * d);
    }, 950 * d);
  }
  revealNow() { this._settle(); }
  reset() {
    clearTimeout(this._timer);
    this.done = false;
    this.compass.classList.remove('is-settled');
    this._hidden.forEach((el) => {
      el.style.transitionDelay = '';
      el.classList.add('fx-hidden');
    });
    this._timer = setTimeout(() => this._settle(), 3400);
    if (this.ctx.onProgress) this.ctx.onProgress(0);
  }
  destroy() {
    clearTimeout(this._timer);
    if (this.compass) this.compass.removeEventListener('click', this._tap);
    this.ctx.media.replaceChildren();
  }
}

const EFFECTS = {
  fog: FogEffect, envelope: EnvelopeEffect, typewriter: TypewriterEffect,
  polaroid: PolaroidEffect, steps: StepsEffect, scroll: ScrollEffect,
  cat: CatEffect, compass: CompassEffect
};

/* ================= DeckController ================= */
class DeckController {
  constructor({ refs, deck, logger, host, audio }) {
    this.refs = refs;
    this.deck = deck;
    this.logger = logger;
    this.host = host;
    this.audio = audio;
    this.index = 0;
    this.state = 'idle';
    this.effect = null;
    this.companion = null;
    this.btnNext = null;
    this.btnReplay = null;
    this.reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.events = [];
    this._skip = this._skip.bind(this);
    this._sound = this._sound.bind(this);
    this._restart = this._restart.bind(this);
    this._keys = this._keys.bind(this);
  }
  get card() { return this.deck.cards[this.index]; }
  get isLast() { return this.index === this.deck.cards.length - 1; }
  track(type, payload) {
    this.events.push({ type, at: Date.now(), payload });
    this.logger.debug('event', type);
  }
  async start() {
    this._validate();
    this._setState('loading');
    this._bindGlobal();
    this.host.ready();
    await this._fonts();
    const q = new URLSearchParams(location.search);
    const n = parseInt(q.get('card'), 10);
    if (Number.isInteger(n) && n >= 1) {
      this.index = clamp(n - 1, 0, this.deck.cards.length - 1);
    }
    this.renderCard();
  }
  _validate() {
    if (!Array.isArray(this.deck.cards) || this.deck.cards.length === 0) {
      throw new Error('В колоде нет карточек');
    }
    for (const c of this.deck.cards) {
      if (!c.id || !c.title || !Array.isArray(c.paragraphs)) {
        throw new Error('Карточка ' + (c.id || '?') + ' повреждена');
      }
      if (!EFFECTS[c.reveal && c.reveal.type]) {
        throw new Error('Неизвестный переход: ' + (c.reveal && c.reveal.type));
      }
    }
  }
  async _fonts() {
    try {
      if (document.fonts && document.fonts.ready) {
        await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2200))]);
      }
    } catch (e) { this.logger.warn('fonts', e); }
  }
  _bindGlobal() {
    this.refs.skip.addEventListener('click', this._skip);
    this.refs.sound.addEventListener('click', this._sound);
    this.refs.restart.addEventListener('click', this._restart);
    this.refs.reload.addEventListener('click', () => location.reload());
    window.addEventListener('keydown', this._keys);
  }
  _keys(e) {
    if (e.key === 'ArrowRight' && this.state === 'revealed') this._next();
  }
  _setState(s) {
    this.state = s;
    this.refs.scene.dataset.state = s;
  }
  _announce(msg) { this.refs.live.textContent = msg; }
  renderCard() {
    const card = this.card;
    if (this.effect) { this.effect.destroy(); this.effect = null; }
    if (this.companion) { this.companion.destroy(); this.companion = null; }
    this.refs.scene.dataset.reveal = card.reveal.type;
    this.refs.stage.replaceChildren();
    this.refs.stage.classList.remove('is-out', 'touch-drag');

    const article = document.createElement('article');
    article.className = 'card';
    const media = document.createElement('div');
    media.className = 'card__media';
    const eyebrow = document.createElement('p');
    eyebrow.className = 'card__eyebrow';
    eyebrow.textContent = card.eyebrow || '';
    const title = document.createElement('h1');
    title.className = 'card__title';
    title.id = 'card-title';
    title.textContent = card.title;
    const body = document.createElement('div');
    body.className = 'card__body';
    body.id = 'card-body';
    body.tabIndex = -1;
    const paragraphs = card.paragraphs.map((text, i) => {
      const p = document.createElement('p');
      p.textContent = text;
      if (i === card.paragraphs.length - 1) p.classList.add('is-emphasised');
      body.appendChild(p);
      return p;
    });
    const actions = document.createElement('div');
    actions.className = 'card__actions';
    this.btnNext = document.createElement('button');
    this.btnNext.type = 'button';
    this.btnNext.className = 'btn btn--primary';
    this.btnNext.textContent = this.isLast ? 'Конец ❤️' : 'Дальше';
    this.btnNext.hidden = true;
    this.btnNext.addEventListener('click', () => this._next());
    this.btnReplay = document.createElement('button');
    this.btnReplay.type = 'button';
    this.btnReplay.className = 'btn btn--quiet';
    this.btnReplay.textContent = 'Ещё раз';
    this.btnReplay.hidden = true;
    this.btnReplay.addEventListener('click', () => this._replay());
    actions.appendChild(this.btnNext);
    actions.appendChild(this.btnReplay);

    article.append(media, eyebrow, title, body, actions);

    let catSlot = null;
    if (card.reveal.type !== 'cat' && card.cat) {
      catSlot = document.createElement('div');
      catSlot.className = 'cat-slot cat-slot--sm cat-slot--' + card.cat;
      title.insertAdjacentElement('afterend', catSlot);
    }

    this.refs.stage.appendChild(article);

    if (paragraphs.length === 0) {
      this._setState('empty');
      this.refs.empty.hidden = false;
      return;
    }
    this.refs.empty.hidden = true;

    this.ctx = {
      scene: this.refs.scene, stage: this.refs.stage, card: article,
      title, body, paragraphs, media, catSlot,
      reducedMotion: this.reducedMotion, host: this.host, audio: this.audio, logger: this.logger,
      onFirstTouch: () => this._firstTouch(),
      onProgress: (r) => this._progress(r),
      onComplete: () => this._complete()
    };

    this.refs.hintText.textContent = card.reveal.hint || '';
    this.refs.hint.dataset.hidden = 'false';
    this.refs.skip.hidden = false;
    this.refs.meter.dataset.active = 'false';
    this.refs.meterFill.style.width = '0%';

    const Cls = EFFECTS[card.reveal.type];
    this.effect = new Cls(this.ctx, card.reveal).mount();

    if (catSlot) {
      this.companion = new CatCompanion(catSlot, {
        small: true, reducedMotion: this.reducedMotion, host: this.host, audio: this.audio
      }).mount();
    }

    this._setState('ready');
    this._announce(card.reveal.hint || '');
    this.track('card:shown', { cardId: card.id, index: this.index, reveal: card.reveal.type });
    this.logger.info('build', BUILD, '| card', card.id, card.reveal.type);

    if (new URLSearchParams(location.search).get('reveal') === '1') this.effect.revealNow();
  }
  _firstTouch() {
    this.refs.hint.dataset.hidden = 'true';
    this.refs.meter.dataset.active = 'true';
    this.host.impact('light');
  }
  _progress(r) {
    this.refs.meter.dataset.active = 'true';
    this.refs.meterFill.style.width = Math.round(clamp(r, 0, 1) * 100) + '%';
  }
  _complete() {
    this._setState('revealed');
    this.host.notify('success');
    this.refs.skip.hidden = true;
    this.refs.meter.dataset.active = 'false';
    this.btnNext.hidden = false;
    this.btnReplay.hidden = false;
    this._announce('Открыто. ' + this.card.title);
    this.track('card:revealed', { cardId: this.card.id, index: this.index });
    setTimeout(() => {
      if (this.state === 'revealed') {
        try { this.ctx.body.focus({ preventScroll: true }); } catch { /* noop */ }
      }
    }, this.reducedMotion ? 0 : 460);
  }
  _skip() {
    if (!this.effect || this.state === 'revealed') return;
    this.host.impact('medium');
    this.track('card:skipped', { cardId: this.card.id });
    this.effect.revealNow();
  }
  _replay() {
    if (!this.effect) return;
    this.effect.reset();
    this.btnNext.hidden = true;
    this.btnReplay.hidden = true;
    this.refs.skip.hidden = false;
    this.refs.hint.dataset.hidden = 'false';
    this.refs.meter.dataset.active = 'false';
    this.refs.meterFill.style.width = '0%';
    this._setState('ready');
    this._announce(this.card.reveal.hint || '');
  }
  _next() {
    if (this.state !== 'revealed') return;
    if (this.isLast) {
      this.refs.finale.hidden = false;
      this.refs.restart.focus();
      this.track('deck:finished', {});
      return;
    }
    this.refs.stage.classList.add('is-out');
    setTimeout(() => {
      this.index += 1;
      this.renderCard();
    }, this.reducedMotion ? 0 : 220);
  }
  _restart() {
    this.refs.finale.hidden = true;
    this.index = 0;
    this.renderCard();
  }
  _sound() {
    const muted = !this.audio.muted;
    this.audio.setMuted(muted);
    this.refs.sound.textContent = muted ? '🔇' : '🔊';
    this.refs.sound.setAttribute('aria-pressed', String(!muted));
    this.refs.sound.setAttribute('aria-label', muted ? 'Звук мурчания: выключен' : 'Звук мурчания: включён');
  }
  fail(error) {
    this.logger.error('fatal', error);
    showFatal('Не удалось подготовить историю: ' +
      (error && error.message ? error.message : 'неизвестная ошибка'));
  }
}

/* ================= bootstrap ================= */
(function bootstrap() {
  const logger = createLogger('[apology]');
  const refs = {
    scene: document.getElementById('scene'),
    stage: document.getElementById('stage'),
    hint: document.getElementById('hint'),
    hintText: document.getElementById('hint-text'),
    meter: document.getElementById('meter'),
    meterFill: document.getElementById('meter-fill'),
    skip: document.getElementById('btn-skip'),
    sound: document.getElementById('btn-sound'),
    restart: document.getElementById('btn-restart'),
    reload: document.getElementById('btn-reload'),
    error: document.getElementById('state-error'),
    errorText: document.getElementById('state-error-text'),
    empty: document.getElementById('state-empty'),
    finale: document.getElementById('finale'),
    live: document.getElementById('live')
  };
  const missing = Object.entries(refs).filter(([, el]) => !el).map(([k]) => k);
  if (missing.length) {
    window.__apologyBooted = true;
    showFatal('Страница повреждена: не найдены элементы ' + missing.join(', ') +
      '. Файл скопирован не полностью — вставь код заново целиком.');
    return;
  }
  if (!Array.isArray(DECK.cards) || DECK.cards.length !== 8) {
    window.__apologyBooted = true;
    showFatal('Файл повреждён: карточек найдено ' +
      (Array.isArray(DECK.cards) ? DECK.cards.length : 0) + ', должно быть 8. Код вставлен не целиком.');
    return;
  }
  const host = createHost(logger);
  const audio = createPurrAudio(logger);
  const controller = new DeckController({ refs, deck: DECK, logger, host, audio });
  try {
    controller.start().catch((e) => controller.fail(e));
  } catch (e) {
    controller.fail(e);
  }
  window.__apologyBooted = true;
})();
</script>
