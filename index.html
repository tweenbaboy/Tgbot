<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#A9682F">
<meta name="description" content="Для тебя. Восемь карточек — потри, нажми, погладь.">
<title>Для тебя ❤️</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  /* Ранний инит для будущего Mini App; вне Telegram — безвредно. */
  (function () {
    try {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      if (typeof tg.ready === 'function') tg.ready();
      if (typeof tg.expand === 'function') tg.expand();
      if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#A9682F');
      if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#6E431F');
      if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    } catch (e) { /* noop */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= tokens ================= */
:root{
  --caramel-900:#3a2210; --caramel-700:#6e431f; --caramel-600:#7e4f27;
  --caramel-500:#a9682f; --caramel-400:#ce9657; --caramel-300:#e0b57f;
  --cream-50:#fffdf8; --cream-100:#fff8ee; --cream-200:#f6e7d2; --cream-300:#ead6bb;
  --ink-900:#241505; --ink-700:#3d2612; --ink-500:#6b4c2e; --ivory:#fff7ec;
  --rust:#b34a2e; --heart:#c0554d;
  --font-display:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --font-text:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-eyebrow:clamp(.6875rem,2.6vw,.75rem);
  --fs-title:clamp(2.1rem,8vw,3.3rem);
  --fs-body:clamp(1.0625rem,4.2vw,1.25rem);
  --fs-ui:clamp(.875rem,3.4vw,.9375rem);
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --touch:2.75rem;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-text);color:var(--ink-900);background:var(--caramel-700);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip-link{position:fixed;top:.75rem;left:50%;z-index:90;transform:translate(-50%,-220%);
  padding:.75rem 1.5rem;border-radius:999px;background:var(--caramel-900);color:var(--ivory);
  font-weight:600;text-decoration:none;transition:transform .3s var(--ease)}
.skip-link:focus-visible{transform:translate(-50%,0)}

/* ================= scene ================= */
.scene{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;isolation:isolate}
.scene__paper{position:absolute;inset:0;z-index:1;background-color:var(--cream-100);
  background-image:
    radial-gradient(120% 80% at 14% 6%,var(--cream-50) 0%,rgba(255,253,248,0) 58%),
    radial-gradient(100% 70% at 88% 96%,var(--cream-200) 0%,rgba(246,231,210,0) 62%),
    repeating-linear-gradient(135deg,rgba(107,76,46,.028) 0 1px,rgba(107,76,46,0) 1px 3px)}
.scene__paper::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 100% at 50% 45%,rgba(107,76,46,0) 55%,rgba(107,76,46,.09) 100%)}
.stage{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  padding:calc(1.5rem + env(safe-area-inset-top,0)) 1.25rem
    calc(9.5rem + env(safe-area-inset-bottom,0)) 1.25rem;
  overflow-y:auto;transition:opacity .22s var(--ease)}
.stage.is-out{opacity:0}
.stage.touch-drag{touch-action:none}

/* ================= card ================= */
.card{position:relative;width:100%;max-width:34rem;text-align:center}
.card__eyebrow{margin:0 0 1rem;font-size:var(--fs-eyebrow);font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-500)}
.card__media{display:flex;justify-content:center}
.card__media:empty{display:none}
.card__title{margin:0;font-family:var(--font-display);font-size:var(--fs-title);
  font-weight:600;line-height:1.08;letter-spacing:-.01em;color:var(--ink-900);
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.card__body{margin-top:1.25rem;display:grid;gap:1rem;outline:none}
.card__body p{margin:0;font-size:var(--fs-body);line-height:1.7;text-wrap:pretty;
  transition:opacity .5s var(--ease),transform .5s var(--ease)}
.card__body p.is-emphasised{color:var(--ink-700);font-weight:500}
.card__actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
.fx-hidden{opacity:0 !important;transform:translateY(.7rem) !important}
.scene[data-state="revealed"] .card__title,
.scene[data-state="revealed"] .card__body p{opacity:1 !important;transform:none !important}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--touch);
  min-width:var(--touch);padding:.75rem 1.5rem;border:1px solid transparent;border-radius:999px;
  font-size:var(--fs-ui);font-weight:600;cursor:pointer;touch-action:manipulation;
  transition:transform .14s var(--ease),background-color .14s var(--ease),opacity .14s linear}
.btn:focus-visible,.icon-btn:focus-visible,.envelope:focus-visible{outline:3px solid var(--caramel-600);outline-offset:3px}
.btn--primary{background:var(--caramel-900);color:var(--ivory);box-shadow:0 .75rem 2rem -1rem rgba(58,34,16,.35)}
.btn--primary:hover{background:var(--ink-900);transform:translateY(-1px)}
.btn--primary:active{transform:scale(.985)}
.btn--quiet{background:transparent;border-color:rgba(107,76,46,.4);color:var(--ink-700)}
.btn--quiet:hover{background:var(--cream-200)}
.btn--skip{position:static;background:rgba(42,23,8,.78);border-color:rgba(255,247,236,.42);color:var(--ivory)}
.btn--skip:hover{background:var(--caramel-900)}
.icon-btn{min-width:var(--touch);min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center;
  border-radius:999px;border:1px solid rgba(107,76,46,.4);background:var(--cream-50);
  font-size:1.05rem;cursor:pointer;touch-action:manipulation;transition:background-color .14s var(--ease)}
.icon-btn:hover{background:var(--cream-200)}

/* ================= fixed UI ================= */
.ui-top{position:fixed;top:calc(.75rem + env(safe-area-inset-top,0));right:calc(.75rem + env(safe-area-inset-right,0));z-index:50}
.ui-bottom{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0));
  transform:translateX(-50%);z-index:50;display:grid;justify-items:center;gap:.75rem;
  width:min(20rem,calc(100% - 1.5rem))}
.hint{max-width:100%;padding:.45rem 1rem;border-radius:999px;font-size:var(--fs-ui);font-weight:500;
  line-height:1.4;text-align:center;color:var(--ink-700);background:rgba(255,253,248,.8);
  border:1px solid rgba(107,76,46,.25);transition:opacity .3s var(--ease)}
.scene[data-reveal="fog"] .hint{color:var(--ivory);background:rgba(42,23,8,.4);
  border-color:rgba(255,247,236,.25);text-shadow:0 1px 3px rgba(42,23,8,.6)}
.hint[data-hidden="true"]{opacity:0}
.meter{width:min(14rem,100%);height:.25rem;border-radius:999px;background:rgba(42,23,8,.3);overflow:hidden;
  opacity:0;transition:opacity .3s var(--ease)}
.meter[data-active="true"]{opacity:1}
.meter__fill{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--caramel-300),var(--ivory));transition:width .12s linear}
.loader{position:fixed;inset:0;z-index:55;display:none;place-items:center}
.scene[data-state="loading"] .loader{display:grid}
.loader__dots{display:flex;gap:.5rem}
.loader__dots span{width:.5rem;height:.5rem;border-radius:50%;background:var(--ivory);opacity:.45;
  animation:bounce 1.1s var(--ease) infinite}
.loader__dots span:nth-child(2){animation-delay:.15s}
.loader__dots span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-.4rem);opacity:1}}

/* ================= panels / finale ================= */
.state-panel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1.5rem;background:var(--cream-100)}
.state-panel__box{width:min(24rem,100%);padding:2rem;border-radius:1.5rem;background:var(--cream-50);
  box-shadow:0 .75rem 2rem -1rem rgba(58,34,16,.35);text-align:center;display:grid;gap:1rem;justify-items:center}
.state-panel__title{margin:0;font-family:var(--font-display);font-size:1.7rem;font-weight:600}
.state-panel__text{margin:0;font-size:var(--fs-ui);line-height:1.6;color:var(--ink-500);overflow-wrap:anywhere}
.finale{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1.5rem;
  background:radial-gradient(120% 90% at 50% 30%,var(--cream-50),var(--cream-200))}
.finale[hidden]{display:none}
.finale__box{text-align:center;display:grid;gap:1.25rem;justify-items:center}
.finale__heart{font-size:4.5rem;line-height:1;animation:pulse 1.6s var(--ease) infinite}
.finale__text{margin:0;font-family:var(--font-display);font-size:clamp(1.5rem,6vw,2rem);font-weight:600}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ================= fog ================= */
canvas.fog{position:absolute;inset:0;z-index:30;width:100%;height:100%;touch-action:none;
  cursor:grab;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .55s var(--ease)}
canvas.fog:active{cursor:grabbing}
canvas.fog[data-gone="true"]{opacity:0;pointer-events:none}
.title-ghost{position:fixed;top:0;left:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .3s var(--ease) .12s}
.title-ghost[data-synced="true"]{opacity:1}
.title-ghost.is-gone{opacity:0;transition-delay:.12s;transition-duration:.2s}
.title-ghost__scrim{position:absolute;inset:-2rem -2.75rem;filter:blur(2px);
  background:radial-gradient(58% 62% at 50% 50%,rgba(58,34,16,.55) 0%,rgba(58,34,16,.34) 46%,rgba(58,34,16,0) 78%)}
.title-ghost__text{position:relative;display:block;color:var(--ivory);text-align:center;
  text-shadow:0 1px 0 rgba(42,23,8,.45),0 0 1.5rem rgba(42,23,8,.35)}

/* ================= cat ================= */
.cat-slot{position:relative;display:flex;width:100%;margin:.5rem auto;touch-action:none;
  user-select:none;-webkit-user-select:none}
.cat-slot--left{justify-content:flex-start}
.cat-slot--right{justify-content:flex-end}
.cat-slot--center{justify-content:center}
.cat-slot--sm .cat-wrap{width:clamp(6rem,22vw,7.5rem)}
.cat-slot--big .cat-wrap{width:clamp(11.5rem,54vw,14.5rem)}
.cat-wrap{position:relative}
.cat{width:100%;height:auto;display:block;cursor:grab}
.cat:active{cursor:grabbing}
.cat__shadow{fill:rgba(107,76,46,.14)}
.cat__tail{fill:none;stroke:#e8a85c;stroke-width:14;stroke-linecap:round;
  transform-box:fill-box;transform-origin:left bottom;animation:tail 2.6s var(--ease) infinite}
.cat__body,.cat__ear,.cat__face{fill:#e8a85c}
.cat__chest,.cat__paw{fill:#f7dfc0}
.cat__ear-inner{fill:#e29a9a}
.cat__stripe{fill:none;stroke:#c97f35;stroke-width:4;stroke-linecap:round}
.cat__eyes-open circle{fill:#3a2210}
.cat__eye-glint{fill:#fff7ec}
.cat__eyes-closed path{fill:none;stroke:#3a2210;stroke-width:4;stroke-linecap:round}
.cat__blush{fill:#e2857f;opacity:0;transition:opacity .32s var(--ease)}
.cat__nose{fill:#d97b7b}
.cat__mouth{fill:none;stroke:#3a2210;stroke-width:3;stroke-linecap:round}
.cat__whiskers path{fill:none;stroke:#3a2210;stroke-width:2.4;stroke-linecap:round;opacity:.45}
.cat__head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .32s var(--ease)}
.cat__zzz{font:600 1.1rem var(--font-text);fill:#6b4c2e;animation:zzz 2.8s var(--ease) infinite}
.cat__zzz--mid{font-size:.9rem;animation-delay:.5s}
.cat__zzz--small{font-size:.75rem;animation-delay:1s}
.cat__purr-bubble rect{fill:#fffdf8;stroke:#ead6bb;stroke-width:2}
.cat__purr-bubble text{font:600 .95rem var(--font-text);fill:#3d2612;text-anchor:middle}
.cat__purr-bubble{opacity:0;transform-box:fill-box;transform-origin:0% 50%;transform:scale(.6);
  transition:opacity .32s var(--ease-out),transform .32s var(--ease-out)}
.cat__eyes-open{display:none}
.is-awake .cat__eyes-open{display:block}
.is-awake .cat__eyes-closed{display:none}
.is-awake .cat__zzz,.is-bliss .cat__zzz,.is-purring .cat__zzz{display:none}
.is-bliss .cat__eyes-open,.is-purring .cat__eyes-open{display:none}
.is-bliss .cat__eyes-closed,.is-purring .cat__eyes-closed{display:block}
.is-bliss .cat__blush,.is-purring .cat__blush{opacity:.55}
.is-bliss .cat__head{transform:rotate(-4deg) translateY(2px)}
.is-purring .cat__head{transform:translateY(2px)}
.is-purring .cat__purr-bubble{opacity:1;transform:scale(1)}
.is-purring .cat__tail{animation-duration:.9s}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes zzz{0%{opacity:0;transform:translateY(4px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-8px)}}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:visible}
.heart{position:absolute;left:50%;bottom:55%;width:1.3rem;height:1.3rem;color:var(--heart);
  animation:heart 1.1s var(--ease-out) forwards}
.heart svg{width:100%;height:100%;fill:currentColor}
@keyframes heart{0%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),10px) scale(.5)}
  20%{opacity:.95}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.15)}}

/* ================= envelope ================= */
.fx-envelope{position:absolute;inset:0;z-index:20;display:grid;place-items:center}
.envelope{position:relative;width:min(17rem,80vw);aspect-ratio:1.45;border:0;padding:0;background:none;
  cursor:pointer;perspective:600px;transition:transform .6s var(--ease),opacity .6s var(--ease)}
.envelope__back{position:absolute;inset:0;border-radius:.75rem;background:linear-gradient(160deg,#f3e0c6,#e5c9a3);
  box-shadow:0 1.2rem 2.4rem -1rem rgba(58,34,16,.45)}
.envelope__letter{position:absolute;left:6%;right:6%;top:8%;bottom:0;border-radius:.5rem;background:var(--cream-50);
  box-shadow:0 .3rem .8rem rgba(58,34,16,.18);transition:transform .5s var(--ease) .15s}
.envelope__flap{position:absolute;top:0;left:0;right:0;height:54%;z-index:3;
  background:linear-gradient(#efd8b8,#dfbd90);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transition:transform .5s var(--ease)}
.envelope__seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  width:3rem;height:3rem;border-radius:50%;background:var(--rust);color:var(--ivory);
  display:grid;place-items:center;font-size:1.25rem;box-shadow:0 .3rem .7rem rgba(58,34,16,.35);
  transition:opacity .3s var(--ease)}
.envelope.is-open .envelope__flap{transform:rotateX(180deg)}
.envelope.is-open .envelope__seal{opacity:0}
.envelope.is-open .envelope__letter{transform:translateY(-16%)}
.envelope.is-gone{transform:translateY(45%) scale(.94);opacity:0;pointer-events:none}

/* ================= typewriter ================= */
.caret{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;
  vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ================= polaroids ================= */
.polaroid{background:var(--cream-50);padding:.5rem .5rem .85rem;border-radius:.4rem;
  box-shadow:0 .7rem 1.5rem -.6rem rgba(58,34,16,.4);
  opacity:0;transform:rotate(var(--tilt,-3deg)) translateY(1.2rem) scale(.92);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.polaroid.fx-shown{opacity:1;transform:rotate(var(--tilt,-3deg)) translateY(0) scale(1)}
.polaroid:nth-child(odd){--tilt:-3deg}
.polaroid:nth-child(even){--tilt:2.5deg}
.polaroid__photo{aspect-ratio:5/3;border-radius:.3rem;display:grid;place-items:center;font-size:1.9rem}
.polaroid:nth-of-type(1) .polaroid__photo{background:linear-gradient(140deg,#e0b57f,#a9682f)}
.polaroid:nth-of-type(2) .polaroid__photo{background:linear-gradient(140deg,#e8a85c,#b34a2e)}
.polaroid:nth-of-type(3) .polaroid__photo{background:linear-gradient(140deg,#ce9657,#7e4f27)}
.polaroid:nth-of-type(4) .polaroid__photo{background:linear-gradient(140deg,#f3e0c6,#ce9657)}
.polaroid p{margin:.6rem 0 0 !important;font-size:var(--fs-ui) !important;color:var(--ink-700)}

/* ================= steps ================= */
.step{position:relative;padding:.65rem 1rem;background:var(--cream-50);border:1px solid var(--cream-300);
  border-radius:.8rem;box-shadow:0 .4rem 1rem -.5rem rgba(58,34,16,.3);text-align:left;
  opacity:0;transform:translateY(.9rem);transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
.step.fx-shown{opacity:1;transform:none}
.step:nth-of-type(2){margin-left:1.1rem}
.step:nth-of-type(3){margin-left:2.2rem}
.step::before{content:"🐾";position:absolute;left:-1.35rem;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.7}
.step p{margin:0 !important;font-size:var(--fs-ui) !important}

/* ================= scroll ================= */
.fx-scroll{clip-path:inset(0 0 calc(100% - var(--unroll,10%)) 0)}
.fx-scroll.fx-open{clip-path:none}
.fx-scroll-roll{position:absolute;left:-2%;right:-2%;height:1.3rem;border-radius:999px;z-index:6;
  background:linear-gradient(180deg,#f3e0c6,#c9a06b);box-shadow:0 .45rem .9rem rgba(58,34,16,.35);
  transform:translateY(-55%);transition:opacity .4s var(--ease)}
.fx-scroll-roll[data-done="true"]{opacity:0}

/* ================= compass ================= */
.compass{width:clamp(8.5rem,32vw,10.5rem);height:auto;margin-bottom:1rem;cursor:pointer}
.compass__ring{fill:none;stroke:#9a6331;stroke-width:3}
.compass__dial{fill:var(--cream-50);stroke:var(--cream-300);stroke-width:2}
.compass__tick{stroke:#6b4c2e;stroke-width:2;opacity:.5}
.compass__tick--major{stroke-width:3;opacity:.85}
.compass__letter{font:600 13px var(--font-text);fill:#6b4c2e;text-anchor:middle}
.compass__heart{fill:var(--heart)}
.compass__needle{transform-box:fill-box;transform-origin:50% 50%;animation:lost 3.4s ease-in-out infinite}
.compass.is-settled .compass__needle{animation:settle 1.9s var(--ease-out) forwards}
.compass__needle-n{fill:var(--rust)}
.compass__needle-s{fill:var(--caramel-400)}
.compass__pin{fill:var(--caramel-900)}
@keyframes lost{0%{transform:rotate(-26deg)}25%{transform:rotate(18deg)}50%{transform:rotate(-12deg)}75%{transform:rotate(7deg)}100%{transform:rotate(-26deg)}}
@keyframes settle{0%{transform:rotate(-55deg)}40%{transform:rotate(12deg)}70%{transform:rotate(-5deg)}100%{transform:rotate(0deg)}}

/* ================= a11y ================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms !important;animation-iteration-count:1 !important;transition-duration:1ms !important}
}
@media (max-height:34rem){
  .stage{align-items:flex-start;padding-top:2.5rem}
}
</style>
</head>
<body>
<a class="skip-link" href="#card-body">К тексту</a>

<main class="scene" id="scene" data-state="loading" data-reveal="">
  <div class="scene__paper" aria-hidden="true"></div>
  <div class="stage" id="stage"></div>

  <div class="ui-top">
    <button class="icon-btn" id="btn-sound" type="button" aria-pressed="true" aria-label="Звук мурчания: включён">🔊</button>
  </div>

  <div class="ui-bottom">
    <p class="hint" id="hint" data-hidden="false"><span id="hint-text"></span></p>
    <div class="meter" id="meter" data-active="false" aria-hidden="true"><span class="meter__fill" id="meter-fill"></span></div>
    <button class="btn btn--skip" id="btn-skip" type="button">Показать сразу</button>
  </div>

  <section class="state-panel" id="state-error" hidden>
    <div class="state-panel__box">
      <h2 class="state-panel__title">Что-то пошло не так</h2>
      <p class="state-panel__text" id="state-error-text">Обнови страницу — текст никуда не делся.</p>
      <button class="btn btn--primary" id="btn-reload" type="button">Обновить</button>
    </div>
  </section>

  <section class="state-panel" id="state-empty" hidden>
    <div class="state-panel__box">
      <h2 class="state-panel__title">Здесь пока пусто</h2>
      <p class="state-panel__text">В этой карточке нет текста.</p>

          last = (last + 0.02 * w) / 1.02;

      }, 300);
    }
    for (let i = 0; i < 8; i += 1) setTimeout(() => this._heart(), i * 90);
    if (this.onComplete) this.onComplete({ pets: this.pets });
  }
  revealNow() {
    if (!this.gated || this.completed) return;
    this.pets = this.petsNeeded;
    if (!this._touched) { this._touched = true; this.el.classList.add('is-awake'); }
    this._complete();
  }
  reset() {
    clearTimeout(this._blissTimer);
    clearTimeout(this._purrTimer);
    clearInterval(this._hapticTimer);
    this.pets = 0;
    this.completed = false;
    this._touched = false;
    this.el.classList.remove('is-awake', 'is-bliss', 'is-purring');
    if (this.hearts) this.hearts.replaceChildren();
    if (this.audio) this.audio.stop();
  }
  destroy() {
    if (this.destroyed) return;
    this.destroyed = true;
    clearTimeout(this._blissTimer);
    clearTimeout(this._purrTimer);
    clearInterval(this._hapticTimer);
    this.el.removeEventListener('pointerdown', this._down);
    this.el.removeEventListener('pointermove', this._move);
    this.el.removeEventListener('pointerup', this._up);
    this.el.removeEventListener('pointercancel', this._up);
    if (this.audio) this.audio.stop();
    this.el.replaceChildren();
  }
}
